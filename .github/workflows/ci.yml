name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -Dwarnings

permissions:
  contents: read

jobs:
  fmt:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all --check
      - name: Verify workspace packages are not publishable
        run: |
          cargo metadata --no-deps --format-version 1 |
            jq -e '.packages | all(.publish == [])'

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --all-targets --all-features -- -D warnings
      - run: cargo clippy --all-targets --no-default-features -- -D warnings

  audit:
    name: Security Audit
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: write
    steps:
      - uses: actions/checkout@v7
      - uses: rustsec/audit-check@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

  # Fast test for PRs - ubuntu + stable only
  test-pr:
    name: Test (PR)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # Test with fast SLH-DSA variants only (skip slow -s variants)
      - name: Test core crates
        run: cargo test -p kylix-core -p kylix-ml-kem -p kylix-ml-dsa --all-features
      - name: Test SLH-DSA fast variants
        run: cargo test -p kylix-slh-dsa --features "std,slh-dsa-shake-128f,slh-dsa-shake-192f,slh-dsa-shake-256f"
      - name: Test integration
        run: cargo test -p kylix-pqc --all-features

  # Exercise the scalar fallback: --no-default-features drops the `simd` feature,
  # so the non-SIMD code paths actually execute instead of being merely compiled.
  test-scalar:
    name: Test (scalar fallback)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Test kylix-core
        run: cargo test -p kylix-core --no-default-features --features std
      - name: Test ML-KEM
        run: cargo test -p kylix-ml-kem --no-default-features --features "std,ml-kem-512,ml-kem-768,ml-kem-1024"
      - name: Test ML-DSA
        run: cargo test -p kylix-ml-dsa --no-default-features --features "std,ml-dsa-44,ml-dsa-65,ml-dsa-87"
      - name: Test SLH-DSA fast variants
        run: cargo test -p kylix-slh-dsa --no-default-features --features "std,slh-dsa-shake-128f,slh-dsa-shake-192f,slh-dsa-shake-256f"

  test-no-std:
    name: no_std
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: thumbv7em-none-eabi
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --package kylix-core --no-default-features --target thumbv7em-none-eabi
      - run: cargo build --package kylix-ml-kem --no-default-features --target thumbv7em-none-eabi
      - run: cargo build --package kylix-slh-dsa --no-default-features --features slh-dsa-shake-128f --target thumbv7em-none-eabi

  doc:
    name: Documentation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo doc --all-features --no-deps
        env:
          RUSTDOCFLAGS: -Dwarnings

  msrv:
    name: MSRV
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.75"
      - uses: Swatinem/rust-cache@v2
      # kylix-test-util is a dev-only, unpublished crate; it depends on proptest,
      # which needs a newer compiler than the MSRV. Excluding it keeps this job
      # checking only the crates whose MSRV we actually promise.
      - run: cargo check --workspace --all-features --exclude kylix-test-util

  constant-time:
    name: Constant-Time Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: timing
      - name: Build timing tests
        run: cargo build --release --manifest-path timing/Cargo.toml --bin ml_kem
      - name: Run ML-KEM dudect gate
        run: |
          set -o pipefail
          timeout 20m ./timing/target/release/ml_kem | tee dudect_output.txt
          bash timing/dudect-gate.sh dudect_output.txt \
            decaps_768_fixed_vs_random decaps_768_valid_vs_invalid
