          - target: fuzz_sign
            max_len: 10240
          - target: fuzz_verify
            max_len: 16384
          - target: fuzz_roundtrip
            max_len: 10240
          # selector + length prefixes + ML-DSA-87 pk (2592) + sig (4627) + message
          - target: fuzz_verify_bytes
            max_len: 8192
