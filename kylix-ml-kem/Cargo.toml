[package]
name = "kylix-ml-kem"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
categories.workspace = true
keywords.workspace = true
description = "ML-KEM (FIPS 203) implementation for the Kylix post-quantum cryptography library"
publish = false
# Keep large ACVP fixtures and tests that require path-only scaffolding out of
# ad-hoc Cargo package archives.
exclude = [
    "tests/acvp/",
    "tests/acvp_tests.rs",
    "tests/proptest_properties.rs",
]

[features]
default = ["std", "ml-kem-768", "simd"]
std = ["kylix-core/std"]
simd = []  # Enable SIMD optimizations (AVX2/NEON)
ml-kem-512 = []
ml-kem-768 = []
ml-kem-1024 = []

[dependencies]
kylix-core.workspace = true
zeroize.workspace = true
rand_core.workspace = true
subtle.workspace = true
sha3 = { version = "0.10", default-features = false }

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[dev-dependencies]
rand = "0.9"
hex = "0.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
proptest = "1.10"
# This internal test scaffolding must never become a registry dependency.
kylix-test-util = { path = "../kylix-test-util" }
